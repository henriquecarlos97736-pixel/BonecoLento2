
name: Build Boneco Lento APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o BonecoLento2_PRONTO_PARA_COMPILAR.zip
          cd BonecoLento2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd BonecoLento2
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BonecoLento2-APK
          path: BonecoLento2/app/build/outputs/apk/debug/app-debug.apk
